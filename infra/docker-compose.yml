services:
  db:
    image: postgres:16
    container_name: ttw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_tech_world
      POSTGRES_USER: ttw
      POSTGRES_PASSWORD: ttw_local_password
    ports:
      - "5432:5432"
    volumes:
      - ttw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttw -d the_tech_world"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ttw_pgdata:
